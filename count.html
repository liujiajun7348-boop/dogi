    shiba: { name:"柴犬", title:"嘴硬心软的独立派", color:"#BD7245", coat:"#CE8C52", ear:"point", tags:["慢热","有边界","暗中在意"], dimension:"独立", pair:"samoyed", buddy:"corgi", description:"「我才没有在等你，只是刚好坐在门口。」你有自己的节奏，不会轻易对谁摇尾巴。熟悉之后才会发现，你的冷静里藏着很多小细节：记住对方的习惯，在需要的时候默默出现。你需要独处，也会认真珍惜愿意尊重这份空间的人。" },
    golden: { name:"金毛", title:"把偏爱写在脸上的人", color:"#AC803B", coat:"#DEB76A", ear:"drop", tags:["温柔","稳定","直球"], dimension:"温和", pair:"shiba", buddy:"labrador", description:"「见到你，就是今天最值得开心的事。」你表达喜欢的方式很直接：回应、陪伴，还有不厌其烦的分享。比起轰轰烈烈，你更擅长把普通日子过得踏实又温暖。不过，照顾大家的同时，也记得把自己的需求说出来。你的好，值得被认真接住。" },
    husky: { name:"哈士奇", title:"快乐永动机，偶尔拆家", color:"#637581", coat:"#82909C", ear:"point", tags:["脑洞","爱玩","气氛组"], dimension:"有趣", pair:"corgi", buddy:"border", description:"「先别问合不合理，就说好不好玩！」你总能给平淡生活加一点意外：临时起意的旅行、奇怪的表情包，还有只属于你们的笑点。你会用玩笑打破尴尬，也希望有人听懂笑话后面那句认真的在意。你不是永远没烦恼，只是很会给生活留一扇透气的窗。" },
    border: { name:"边牧", title:"看穿一切，还替你收尾", color:"#525B55", coat:"#454B49", ear:"point", tags:["聪明","敏锐","有主见"], dimension:"敏锐", pair:"golden", buddy:"husky", description:"「你还没开口，我已经想了三个解决方案。」你观察细致、反应很快，对关系和生活都有自己的判断。你愿意把事情想深，也常常忍不住替在意的人多想一步。偶尔放下分析，把感受直接告诉对方吧。被理解，不需要每次都靠对方猜中你的心思。" },
    samoyed: { name:"萨摩耶", title:"你的专属微笑充电站", color:"#9C8A78", coat:"#EEE6D7", ear:"point", tags:["黏人","柔软","爱贴贴"], dimension:"亲密", pair:"shiba", buddy:"golden", description:"「什么都可以晚一点，抱抱现在就要。」对你来说，分享日常、靠在一起、被及时回应，都是很具体的幸福。你不吝啬表达想念，也能把爱意变成柔软的小动作。你很珍惜亲密感，也可以慢慢练习：对方暂时忙碌，并不等于爱意减少。" },
    labrador: { name:"拉布拉多", title:"温柔这件事，你很专业", color:"#99774F", coat:"#CDB28A", ear:"drop", tags:["体贴","耐心","行动派"], dimension:"体贴", pair:"border", buddy:"golden", description:"「你先休息，剩下的我来。」你很会察觉身边人的情绪，并把关心落到实处。一杯热水、一顿饭、一次耐心的倾听，比漂亮话更像你的表达方式。你愿意照顾别人，但不用靠一直付出来证明自己值得被爱。偶尔安心接受照顾，也是亲密的一部分。" },
    doberman: { name:"杜宾", title:"看着不好惹，其实超护短", color:"#765C4E", coat:"#55443D", ear:"tall", tags:["可靠","坚定","保护欲"], dimension:"担当", pair:"samoyed", buddy:"border", description:"「有我在，我们一起处理。」你的安全感来自行动和承诺：答应的事会记住，重要的人会放在心上。你不一定说很多甜话，但关键时刻从来不会躲开。偶尔也可以卸下盔甲，告诉对方你也会累。并肩站着，比独自扛下所有更长久。" },
    corgi: { name:"柯基", title:"生活再忙，也要快乐干饭", color:"#BC7948", coat:"#D69B63", ear:"round", tags:["松弛","乐观","享受当下"], dimension:"松弛", pair:"husky", buddy:"shiba", description:"「天大的事，吃完这顿再说。」你喜欢舒服、自然的相处，不必时时找话题，也不用把每一天都过成考试。你擅长从小事里找到幸福：好吃的饭、晒到太阳的下午、和喜欢的人散步。你的松弛让人放松，遇到重要的事，也记得给出明确的回应。" }

<script>
"use strict";
// 留空时仅使用本浏览器统计。接入独立计数器后填写自己的站点名。
// 不要把 API_KEY 放进前端文件；它只用于 GitHub Actions 的 Secrets。
window.DOGI_CONFIG = { counterSite: "", counterEndpoint: "https://v1.apizero.cn/api/visits-counter" };

</script>
<script>
"use strict";
window.DOGI_SNAPSHOT = {"site":"","updatedAt":"","data":{}};

</script>
<script>
"use strict";
(() => {
  const key = "dogi_stats_v1";
  let saved = {};
  let persistent = true;
  try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch { persistent = false; }
  if (!saved || typeof saved !== "object" || Array.isArray(saved)) saved = {};
  const safeNumber = value => Number.isSafeInteger(value) && value >= 0 ? value : 0;
  const state = {
    completed:safeNumber(saved.completed),
    breeds:Object.fromEntries(Object.keys(DOGI.breeds).map(id => [id,safeNumber(saved.breeds?.[id])])),
    votes:Object.fromEntries(DOGI.votes.map(([id]) => [id,safeNumber(saved.votes?.[id])])),
    voted:DOGI.votes.some(([id]) => id === saved.voted) ? saved.voted : "",
    updatedAt:typeof saved.updatedAt === "string" ? saved.updatedAt : ""
  };
  function save() {
    state.updatedAt = new Date().toISOString();
    try { localStorage.setItem(key, JSON.stringify(state)); } catch { persistent = false; }
  }
  async function increment(name) {
    if (!DOGI_CONFIG.counterSite) return;
    try {
      const url = new URL(DOGI_CONFIG.counterEndpoint);
      url.search = new URLSearchParams({site:DOGI_CONFIG.counterSite,name,mode:"total",format:"json"});
      await fetch(url, {signal:AbortSignal.timeout(8000)});
    } catch { /* 在线统计失败不影响答题，本地记录仍保留。 */ }
  }
  window.DogiStats = {
    get persistent() { return persistent; },
    read() { return JSON.parse(JSON.stringify(state)); },
    complete(main) {
      if (!Object.hasOwn(DOGI.breeds, main)) return;
      state.completed++; state.breeds[main]++; save();
      void increment("completed"); void increment(main);
    },
    vote(id) {
      if (state.voted || !DOGI.votes.some(([key]) => key === id)) return false;
      state.voted = id; state.votes[id]++; save(); void increment("vote-" + id); return true;
    }
  };
})();

</script>
<script>
"use strict";
(() => {
  const $ = id => document.getElementById(id);
  const remote = Boolean(DOGI_CONFIG.counterSite);
  const snapshot = DOGI_SNAPSHOT.site === DOGI_CONFIG.counterSite ? DOGI_SNAPSHOT : {data:{},updatedAt:""};
  const local = DogiStats.read();
  const safeNumber = value => Number.isSafeInteger(value) && value >= 0 ? value : 0;
  const value = name => remote ? safeNumber(snapshot.data?.[name]?.total) : name === "completed" ? local.completed : name.startsWith("vote-") ? local.votes[name.slice(5)] : local.breeds[name];
  const keys = Object.keys(DOGI.breeds);
  const total = value("completed");
  const sum = keys.reduce((acc,key) => acc + value(key),0);
  $("total").textContent = total.toLocaleString("zh-CN");
  $("scope").textContent = remote ? "次完成测试 · 全站数据快照" : "次完成测试 · 仅当前浏览器的记录";
  const updated = remote ? snapshot.updatedAt : local.updatedAt;
  $("updated").textContent = updated && Number.isFinite(Date.parse(updated)) ? "更新于 " + new Date(updated).toLocaleString("zh-CN") : "还没有记录，来成为第一只小狗。";
  $("distribution").innerHTML = keys.map(key => { const b = DOGI.breeds[key]; const pct = sum ? value(key) / sum * 100 : 0; return `<div class="bar-item"><div class="bar-track"><div class="bar-fill" style="height:${pct}%;background:${b.color}"></div></div><div class="bar-label">${b.name}</div><div class="bar-val">${Math.round(pct)}%</div></div>`; }).join("");
  $("empty").textContent = sum ? "每次测试只计入最终代表犬型；并列结果不会重复计数。" : "完成测试后，这里就会出现真实的犬型分布。";
  $("votes").innerHTML = DOGI.votes.map(([id,label]) => `<div class="stats-vote"><span>${label}</span><span>${value("vote-"+id)} 票</span></div>`).join("");
  $("storageNote").textContent = !DogiStats.persistent ? "浏览器未允许本地存储，当前记录可能无法持久保存。" : remote ? "全站快照由定时任务更新，新增记录不会立即显示。" : "本机记录保存在浏览器中。清除网站数据会重置记录。";
})();

</script>
